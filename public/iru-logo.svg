  <!-- Wordmark -->
  <text x="94" y="54" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="1" fill="#0a2a5e">IRU</text>
  <text x="95" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#0a2a5e">IMMIGRATION READINESS UTILITY</text>
</svg>
